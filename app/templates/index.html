{% extends "base.html" %}

{% block head %}
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="{{ url_for('static', filename='map.css') }}">
{% endblock %}

{% block body_class %}map-page{% endblock %}

{% block content %}
  <section class="controls">
    <label>Colorear por
      <select id="layer">
        <option value="set">Conjunto</option>
        <option value="yield">Rendimiento observado</option>
        <option value="pred">Predicción del modelo</option>
        <option value="risk_costs">Riesgo de no cubrir costos (semáforo)</option>
        <option value="risk_credit">Riesgo de no pagar el crédito (semáforo)</option>
      </select>
    </label>
    <label>Estado
      <select id="state">
        <option value="">Todos</option>
      </select>
    </label>
    <label>Municipio
      <select id="municipality">
        <option value="">Todos</option>
      </select>
    </label>
    <div class="download" role="group" aria-labelledby="download-title">
      <span id="download-title" class="download__title">Descargar</span>
      <a id="download-predictions" class="btn" href="{{ url_for('predictions.predictions', format='csv') }}" download>Predicciones (CSV)</a>
      <a id="download-economics" class="btn" href="{{ url_for('economics.economics_table', format='csv') }}" download>Economía por parcela (CSV)</a>
    </div>
    <span id="count" class="count" aria-live="polite"></span>
  </section>
  <div id="map"
       data-parcels-url="{{ url_for('parcels.parcels') }}"
       data-predictions-url="{{ url_for('predictions.predictions') }}"
       data-economics-url="{{ url_for('economics.economics_table') }}"
       data-detail-url="{{ url_for('detail.page', parcel_id='__ID__') }}"></div>
{% endblock %}

{% block scripts %}
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="{{ url_for('scripts', filename='map.js') }}"></script>
{% endblock %}
