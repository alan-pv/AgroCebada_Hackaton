[project]
name = "agrocebada"
version = "0.1.0"
description = "Reto AgroCebada FIRA 2026: predicción de rendimiento de cebada (t/ha) con datos satelitales, clima y topografía"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas",
    "numpy",
    "geopandas",
    "pyogrio",
    "shapely",
    "rasterio",
    "exactextract",
    "scipy",
    "scikit-learn",
    "lightgbm",
    "shap",
    "pyarrow",
    "matplotlib",
    "joblib",
]

[project.optional-dependencies]
app = ["streamlit", "plotly", "folium"]
tabpfn = ["tabpfn"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agrocebada"]

[tool.pytest.ini_options]
testpaths = ["tests"]
