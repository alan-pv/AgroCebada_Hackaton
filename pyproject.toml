[project]
name = "agrocebada"
version = "0.2.0"
description = "Reto AgroCebada FIRA 2026: predicción de rendimiento de cebada (t/ha) con datos satelitales, clima y topografía"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas",
    "numpy",
    "geopandas",
    "pyogrio",
    "shapely",
    "rasterio",
    "exactextract",
    "scipy",
    "scikit-learn",
    "lightgbm",
    "shap",
    "pyarrow",
    "matplotlib",
    "joblib",
    "flask>=3.1.3",
    "plotly>=7.1.0",
    "waitress>=3.0.2",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
tabpfn = ["tabpfn"]

[project.scripts]
app = "scripts.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agrocebada", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
